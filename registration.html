<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Dream Venture Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f3a32a; 
            --bg: #1a1a1a;
            --darker: #141414;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        @keyframes globalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: globalFade 1.2s ease-out forwards;
        }

        /* --- Simple Nav for Registration Page --- */
        nav {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.3s;
            opacity: 0.6;
        }
        .back-btn:hover { opacity: 1; color: var(--primary); }

        /* --- Form Container --- */
        .registration-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 5%;
        }

        .header-area {
            text-align: center;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .header-area h1 {
            font-family: 'Orbitron';
            color: var(--primary);
            font-size: 2rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        .header-area p {
            font-weight: 200;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        /* --- The Iframe Wrapper --- */
        .form-wrapper {
            width: 100%;
            max-width: 800px;
            background: #fff; /* Jotforms usually look best on white, or adjust Jotform theme to transparent */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            min-height: 800px; /* Adjust based on your form height */
        }

        iframe {
            width: 100%;
            height: 1000px; /* Matches the content height of your form */
            border: none;
        }

        footer { 
            text-align: center; 
            padding: 40px; 
            opacity: 0.4; 
            font-size: 0.6rem; 
            font-family: 'Orbitron'; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-family:'Orbitron'; font-weight:900; color:var(--primary);">DREAM VENTURE</div>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> RETURN HOME</a>
    </nav>

    <main class="registration-container">
        <div class="header-area" data-aos="fade-down">
            <h1>ENROLLMENT PORTAL</h1>
            <p>Please complete the secure 2026 registration protocol below to finalize your application.</p>
        </div>

        <div class="form-wrapper" data-aos="fade-up">
            <!-- EMBEDDED JOTFORM -->
            <iframe
                id="JotFormIFrame-261253405509049"
                title="Registration Form"
                onload="window.parent.scrollTo(0,0)"
                allowtransparency="true"
                allow="geolocation; microphone; camera; fullscreen"
                src="https://form.jotform.com/261253405509049"
                frameborder="0"
                scrolling="yes">
            </iframe>
        </div>
    </main>

    <footer>
        SSM: 003768939-D &copy; 2026 DREAM VENTURE ACADEMY
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
