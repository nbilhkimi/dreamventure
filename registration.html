<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Dream Venture Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f3a32a; 
            --bg: #1a1a1a;
            --darker: #141414;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        @keyframes globalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: globalFade 1.2s ease-out forwards;
            position: relative; /* Needed for canvas positioning */
        }

        /* --- Animated Canvas Background --- */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; /* Sits behind everything */
            pointer-events: none;
        }

        nav, main, footer {
            position: relative;
            z-index: 2; /* Ensures content is above the canvas */
        }

        /* --- Navigation --- */
        nav {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.3s;
            opacity: 0.6;
        }
        .back-btn:hover { opacity: 1; color: var(--primary); }

        /* --- Form Container --- */
        .registration-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 5%;
        }

        .header-area {
            text-align: center;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .header-area h1 {
            font-family: 'Orbitron';
            color: var(--primary);
            font-size: 2rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        .header-area p {
            font-weight: 200;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        /* --- The Iframe Wrapper --- */
        .form-wrapper {
            width: 100%;
            max-width: 800px;
            background: #fff; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            min-height: 800px; 
        }

        iframe {
            width: 100%;
            height: 1000px; 
            border: none;
        }

        footer { 
            text-align: center; 
            padding: 40px; 
            opacity: 0.4; 
            font-size: 0.6rem; 
            font-family: 'Orbitron'; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Background Canvas Container -->
    <div id="particles-js"></div>

    <nav>
        <div style="font-family:'Orbitron'; font-weight:900; color:var(--primary);">DREAM VENTURE</div>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> RETURN HOME</a>
    </nav>

    <main class="registration-container">
        <div class="header-area" data-aos="fade-down">
            <h1>ENROLLMENT PORTAL</h1>
            <p>Please complete the secure 2026 registration protocol below to finalize your application.</p>
        </div>

        <div class="form-wrapper" data-aos="fade-up">
            <iframe
                id="JotFormIFrame-261253405509049"
                title="Registration Form"
                onload="window.parent.scrollTo(0,0)"
                allowtransparency="true"
                allow="geolocation; microphone; camera; fullscreen"
                src="https://form.jotform.com/261253405509049"
                frameborder="0"
                scrolling="yes">
            </iframe>
        </div>
    </main>

    <footer>
        SSM: 003768939-D &copy; 2026 DREAM VENTURE ACADEMY
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize Animations
        AOS.init({ duration: 1000, once: true });

        // Initialize Particles
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#f3a32a" }, // Matching your primary gold/orange
                "shape": { "type": "circle" },
                "opacity": { "value": 0.2, "random": false },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#f3a32a", "opacity": 0.1, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": false } },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
